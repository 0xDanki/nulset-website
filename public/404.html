<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NulSet</title>
    <script>
      // Single Page App hack for GitHub Pages
      // Converts the path to a query string and redirects to index.html
      // index.html then reads this and uses history.replaceState to restore the URL
      const path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace('/' + '?p=' + encodeURIComponent(path));
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
